name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  serverless-demo:
    name: serverless demo (Vercel function)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 300
      - name: Smoke test
        run: |
          curl -fsS http://localhost:5173/healthz
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/actuator/health | grep -q UP
          token=$(curl -fsS -H 'Content-Type: application/json' -d '{"email":"admin@resenha.dev","senha":"admin123"}' http://localhost:5173/api/v1/auth/login | jq -r .token)
          curl -fsS -H "Authorization: Bearer $token" http://localhost:5173/api/v1/produtos | jq -e 'length > 0'
          curl -fsSI http://localhost:5173/ | grep -qi content-security-policy
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
