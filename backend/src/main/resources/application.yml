spring:
  application:
    name: resenhamarket-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resenhamarket}
    username: ${SPRING_DATASOURCE_USERNAME:resenha}
    password: ${SPRING_DATASOURCE_PASSWORD:resenha_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: native
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:dev-only-secret-change-before-deploy-0123456789abcdef}
    expiration: 28800000
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
  login:
    max-falhas: ${APP_LOGIN_MAX_FALHAS:5}
    janela-minutos: ${APP_LOGIN_JANELA_MINUTOS:15}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    cenario: ${APP_SEED_CENARIO:todos}
    reset: ${APP_SEED_RESET:false}
