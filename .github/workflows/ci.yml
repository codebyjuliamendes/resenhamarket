name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: backend (testes + cobertura)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unitários e integração (Testcontainers + PostgreSQL 16); JaCoCo exige 90% das linhas e 75% dos ramos.
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: frontend (tipos + testes + cobertura + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore

  e2e:
    name: ponta a ponta (navegador + API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: resenhamarket
          POSTGRES_USER: resenha
          POSTGRES_PASSWORD: resenha_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resenha -d resenhamarket"
          --health-interval 5s --health-timeout 4s --health-retries 15
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/resenhamarket
      SPRING_DATASOURCE_USERNAME: resenha
      SPRING_DATASOURCE_PASSWORD: resenha_ci
      APP_SEED_ENABLED: 'true'
      APP_SEED_CENARIO: todos
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Subir a API
        run: |
          mvn -B -q -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/resenhamarket-api-0.1.0.jar > api.log 2>&1 &
          for i in $(seq 1 90); do grep -q "Demonstração carregada" api.log && exit 0; sleep 2; done
          cat api.log; exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
            api.log
