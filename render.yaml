# Blueprint do Render para a API Java (Spring Boot). O PostgreSQL fica no Neon: veja docs/DEPLOY.md.
services:
  - type: web
    name: resenhamarket-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ORIGINS
        value: https://resenhamarket.vercel.app,https://resenhamarket-*.vercel.app
      - key: APP_SEED_ENABLED
        value: "true"
      - key: APP_SEED_CENARIO
        value: todos
      - key: APP_SEED_RESET
        value: "false"
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
