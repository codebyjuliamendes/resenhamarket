services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resenhamarket}
      POSTGRES_USER: ${POSTGRES_USER:-resenha}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resenha_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 4s
      retries: 15
  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-resenhamarket}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-resenha}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-resenha_dev}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-only-resenha-market-secret-change-me-0123456789}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173,http://localhost:3120}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      APP_SEED_CENARIO: ${APP_SEED_CENARIO:-todos}
      APP_SEED_RESET: ${APP_SEED_RESET:-false}
      SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
